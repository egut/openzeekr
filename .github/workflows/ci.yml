name: CI

# Runs exactly the checks a contributor runs locally:
#   ./gradlew verify   (gradlew.bat verify on Windows)
#   trunk check
# The Gradle tasks are defined once in the root build.gradle.kts, so "passes locally"
# and "passes CI" mean the same thing.
#
# Linux only, on purpose. Windows runners bill at 2x minutes and roughly doubled the
# wall-clock time of this workflow for a build that is not platform-specific. Windows
# is still a supported DEVELOPMENT platform (gradlew.bat, .editorconfig and the LF/CRLF
# rules in .gitattributes all cover it) — it is just not continuously verified here.
# If a Windows-only regression is suspected, run `gradlew.bat verify` locally, or
# trigger this workflow manually after temporarily adding windows-latest.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gradle verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      # `packages: ''` skips the action's default install of the obsolete `tools`
      # package (removed from the SDK repo; sdkmanager would exit 1).
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: ""

      # Same packages docs/DEVELOPMENT.md lists. The NDK + CMake build :core's libozsecrets.so;
      # the NDK version must match openzeekr.ndkVersion in gradle.properties.
      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # A clean checkout has no secrets.properties / keystore.properties / firebase config.
      # The build must still succeed with every secret blank (the app then starts
      # unconfigured). --continue reports every failing step, not just the first.
      - name: Build, unit test, Android Lint
        run: ./gradlew --continue verify

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  static-analysis:
    name: Trunk static analysis & security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # trufflehog (via Trunk) diffs against the base ref; full history lets it
          # scan the whole range on PRs and pushes.
          fetch-depth: 0

      # Runs every linter/scanner in .trunk/trunk.yaml (ktlint, trufflehog, checkov,
      # markdownlint, yamllint, shellcheck, prettier, ...). Same as `trunk check` locally.
      - name: Trunk Check
        uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
